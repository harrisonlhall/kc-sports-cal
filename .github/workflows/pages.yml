name: Update calendars

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - "package.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      unhealthy: ${{ steps.gen.outputs.unhealthy }}
      unhealthy_teams: ${{ steps.gen.outputs.unhealthy_teams }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate calendars
        id: gen
        run: node scripts/generate.mjs
      - name: Validate ICS
        run: node scripts/validate-ics.mjs dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert-if-stale:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.deploy.result == 'success' && needs.build.outputs.unhealthy == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Fail so the owner is notified
        run: |
          echo "In-season teams with no fresh schedule for at least 72 hours: ${{ needs.build.outputs.unhealthy_teams }}"
          echo "The site was still updated. Those teams are showing their last good events."
          exit 1
